# awesome-dsh-plugin 注册表条目
# 提交方式：把本文件内容复制为 data/plugins/vegetable-kun__DSH_Plugin_Taffy.yml
# 提交到 https://github.com/awesome-dsh-plugin/awesome-dsh-plugin 的 PR 里。
# 字段格式对照官方样例（whale-musume / liquid-glass）：
